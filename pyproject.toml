[project]
name = "remember-me"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Aymir", email = "aaaxilles@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "deepface[tensorflow]>=0.0.101",
    "fastapi>=0.142.2",
    "numpy>=2.4.6",
    "opencv-python>=5.0.0.93",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.1.3",
    "tf-keras>=2.21.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
]
