<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Remember Me</title>
    <link rel="stylesheet" href="/static/styles.css" />
    <script src="/static/app.js" defer></script>
  </head>

  <body>
    <main>
      <header class="page-header">
        <h1>Remember Me</h1>
        <a class="page-link" href="/register">Register person</a>
      </header>

      <div class="recognition-layout">
        <section>
          <div id="camera-frame">
            <video
              id="camera"
              autoplay
              muted
              playsinline
              aria-label="Live camera preview"
            ></video>

            <div id="face-box" hidden></div>
            <p id="camera-placeholder">Camera is off</p>
          </div>

          <canvas id="capture-canvas" hidden></canvas>

          <div class="controls">
            <button id="start-camera" type="button">Start camera</button>

            <button id="stop-camera" type="button" disabled>Stop camera</button>
          </div>
        </section>

        <section id="person-details" aria-live="polite">
          <p id="recognition-status">Camera is off</p>
          <h2 id="person-name">No person detected</h2>
          <p id="person-relationship"></p>

          <div id="conversation-controls" class="conversation-controls" hidden>
            <div class="conversation-buttons">
              <button id="start-recording" type="button">Start recording</button>
              <button id="stop-recording" type="button" disabled>
                Stop recording
              </button>
            </div>
            <p id="recording-status" aria-live="polite"></p>
          </div>
        </section>
      </div>
    </main>
  </body>
</html>
